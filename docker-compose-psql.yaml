name: agentic-erp

services:
  # Disabled for external databases. Opt in with COMPOSE_PROFILES=bundled-database.
  postgres:
    image: postgres:16-alpine
    profiles: ["bundled-database"]
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  migrate:
    image: ${APP_IMAGE:-agentic-erp:latest}
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    command: ["node", "prisma/migrate-postgresql.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: "no"
    security_opt:
      - no-new-privileges:true

  app:
    image: ${APP_IMAGE:-agentic-erp:latest}
    restart: unless-stopped
    init: true
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
